
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atmospredict
spec:
  replicas: 2
  selector:
    matchLabels:
      app: atmospredict
  template:
    metadata:
      labels:
        app: atmospredict
    spec:
      containers:
        - name: atmospredict
          image: divakar2006/atmospredict:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: atmospredict-service
spec:
  type: NodePort
  selector:
    app: atmospredict
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30007
